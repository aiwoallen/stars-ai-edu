<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Space Grotesk',system-ui,sans-serif;background:#0A0E27;color:#E8ECF1;overflow-x:hidden;width:100%;max-width:100vw}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(240,200,80,.03),transparent 70%),radial-gradient(ellipse 60% 60% at 0% 30%,rgba(91,155,213,.02),transparent 60%);pointer-events:none;z-index:0}

/* Sidebar */
.news-sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:rgba(14,18,40,.92);border-right:1px solid rgba(240,200,80,.06);z-index:50;padding:100px 0 40px;overflow-y:auto;-ms-overflow-style:none;scrollbar-width:none;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.news-sidebar::-webkit-scrollbar{display:none}
.news-sidebar .sb-header{padding:0 28px 24px;border-bottom:1px solid rgba(240,200,80,.08);margin-bottom:16px}
.news-sidebar .sb-logo{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:3px;color:rgba(240,200,80,.5);text-transform:uppercase;margin-bottom:8px}
.news-sidebar .sb-title{font-size:18px;font-weight:500;color:#E8ECF1;margin-bottom:4px}
.news-sidebar .sb-sub{font-size:11px;color:#555D80}
.news-sidebar .sb-back{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid rgba(240,200,80,.1);color:#8890B0;font-size:12px;text-decoration:none;margin:0 28px 20px;transition:all .3s}
.news-sidebar .sb-back:hover{border-color:rgba(240,200,80,.3);color:#F0C850;background:rgba(240,200,80,.04)}
.news-sidebar .sb-date-group{margin-bottom:6px}
.news-sidebar .sb-date-label{padding:0 28px;font-size:10px;font-weight:600;letter-spacing:2px;color:rgba(240,200,80,.3);text-transform:uppercase;margin:16px 0 8px}
.news-sidebar .sb-date-link{display:flex;align-items:center;gap:10px;padding:10px 28px;color:#8890B0;font-size:13px;text-decoration:none;transition:all .3s;border-left:2px solid transparent;cursor:pointer;position:relative}
.news-sidebar .sb-date-link:hover{color:#E8ECF1;background:rgba(240,200,80,.03)}
.news-sidebar .sb-date-link.active{color:#F0C850;border-left-color:#F0C850;background:rgba(240,200,80,.05)}
.news-sidebar .sb-date-link .sb-dot{width:6px;height:6px;border-radius:50%;background:#555D80;flex-shrink:0;transition:all .3s}
.news-sidebar .sb-date-link.active .sb-dot{background:#F0C850;box-shadow:0 0 8px rgba(240,200,80,.4)}
.news-sidebar .sb-count{font-size:10px;color:#555D80;margin-left:auto}
.news-sidebar .sb-date-link.active .sb-count{color:#F0C850}

/* Sidebar toggle (mobile) */
.sidebar-toggle{display:none;position:fixed;bottom:24px;left:24px;z-index:60;width:48px;height:48px;border-radius:50%;background:rgba(20,24,50,.9);border:1px solid rgba(240,200,80,.15);color:#E8ECF1;font-size:20px;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:49}

/* Main */
.news-main{margin-left:260px;min-height:100vh;position:relative;z-index:1}
.news-hero{padding:100px 60px 60px;border-bottom:1px solid rgba(240,200,80,.06)}
.news-hero .nh-label{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:rgba(240,200,80,.45);margin-bottom:12px}
.news-hero .nh-title{font-size:clamp(2rem,4vw,3.2rem);font-weight:500;color:#E8ECF1;letter-spacing:1px;max-width:800px;line-height:1.3;margin-bottom:16px}
.news-hero .nh-desc{font-size:15px;color:#8890B0;max-width:600px;line-height:1.7}
.news-hero .nh-live{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;background:rgba(240,200,80,.06);border:1px solid rgba(240,200,80,.1);font-size:11px;color:#F0C850;margin-top:20px}
.news-hero .nh-dot{width:8px;height:8px;border-radius:50%;background:#F0C850;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;box-shadow:0 0 0 0 rgba(240,200,80,.6)}50%{opacity:1;box-shadow:0 0 0 8px rgba(240,200,80,0)}}

/* Date sections */
.news-date-section{padding:60px}
.news-date-header{display:flex;align-items:center;gap:16px;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid rgba(240,200,80,.06)}
.news-date-header .ndh-date{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;color:#E8ECF1;letter-spacing:1px}
.news-date-header .ndh-day{font-size:13px;color:#8890B0;padding-top:4px}
.news-date-header .ndh-line{flex:1;height:1px;background:linear-gradient(to right,rgba(240,200,80,.1),transparent)}

/* News card */
.news-card-h{display:flex;background:rgba(20,24,50,.5);border:1px solid rgba(240,200,80,.05);border-radius:16px;overflow:hidden;margin-bottom:20px;cursor:pointer;transition:all .45s cubic-bezier(.16,1,.3,1);position:relative}
.news-card-h:hover{border-color:rgba(240,200,80,.2);background:rgba(24,28,58,.7);box-shadow:0 16px 48px rgba(0,0,0,.3),0 0 24px rgba(240,200,80,.04)}
.news-card-h .nch-img-wrap{flex:0 0 280px;overflow:hidden;position:relative}
.news-card-h .nch-img{width:100%;height:100%;object-fit:cover;transition:transform .65s cubic-bezier(.16,1,.3,1),filter .5s;filter:grayscale(30%) contrast(1.1) brightness(.7)}
.news-card-h:hover .nch-img{transform:scale(1.06);filter:grayscale(0%) contrast(1.05) brightness(.85)}
.news-card-h .nch-img-overlay{position:absolute;inset:0;background:linear-gradient(to right,transparent 60%,rgba(14,18,40,.8) 100%)}
.news-card-h .nch-category{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:10px;background:rgba(10,14,39,.78);border:1px solid rgba(240,200,80,.15);font-size:10px;font-weight:500;color:#F0C850;letter-spacing:.5px}
.news-card-h .nch-body{flex:1;padding:24px 28px;display:flex;flex-direction:column;justify-content:center}
.news-card-h .nch-title{font-size:17px;font-weight:500;color:#E8ECF1;line-height:1.5;margin-bottom:8px;transition:color .4s}
.news-card-h:hover .nch-title{color:#F0C850}
.news-card-h .nch-summary{font-size:13px;color:#8890B0;line-height:1.7;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-card-h .nch-meta{display:flex;align-items:center;gap:16px;font-size:11px;color:#555D80}
.news-card-h .nch-source{display:flex;align-items:center;gap:5px}
.news-card-h .nch-sdot{width:5px;height:5px;border-radius:50%;background:#5B9BD5}
.news-card-h .nch-arrow{margin-left:auto;font-size:16px;color:#F0C850;opacity:0;transition:all .4s}
.news-card-h:hover .nch-arrow{opacity:1}

/* Footer */
.news-footer{border-top:1px solid rgba(240,200,80,.06);padding:32px 60px;text-align:center;font-size:12px;color:#555D80}

/* Mobile */
@media(max-width:768px){
  .news-sidebar{transform:translateX(-100%);width:280px;padding:80px 0 120px}
  .news-sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:flex}
  .sidebar-overlay{display:none}
  .sidebar-overlay.open{display:block}
  .news-main{margin-left:0}
  .news-hero{padding:80px 24px 40px}
  .news-date-section{padding:32px 16px}
  .news-date-header .ndh-date{font-size:22px}
  .news-card-h{flex-direction:column}
  .news-card-h .nch-img-wrap{flex:0 0 180px;width:100%}
  .news-card-h .nch-img{width:100%;height:180px}
  .news-card-h .nch-img-overlay{background:linear-gradient(to bottom,transparent 40%,rgba(14,18,40,.85) 100%)}
  .news-card-h .nch-body{padding:18px 20px}
  .news-card-h .nch-title{font-size:15px}
  .news-footer{padding:24px}
}
/* ---- Icon Sidebar Nav ---- */
.icon-nav{position:fixed;left:0;top:0;bottom:0;width:60px;z-index:180;display:flex;flex-direction:column;align-items:center;padding:20px 0;background:rgba(14,18,40,.94);border-right:1px solid rgba(240,200,80,.06)}
.icon-nav .in-logo{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#F0C850;letter-spacing:2px;writing-mode:vertical-lr;margin-bottom:20px}
.icon-nav .in-items{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px}
.icon-nav .in-item{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#8890B0;text-decoration:none;transition:all .25s;position:relative}
.icon-nav .in-item:hover{color:#E8ECF1;background:rgba(240,200,80,.04)}
.icon-nav .in-item.active{color:#F0C850;background:rgba(240,200,80,.08)}
.icon-nav .in-item svg{width:18px;height:18px}
.icon-nav .in-dot{position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%;background:#F0C850;border:1.5px solid #0E1232}
.icon-nav .in-item.logged-in::before{content:'';position:absolute;top:6px;right:10px;width:5px;height:5px;border-radius:50%;background:#60d080;border:1px solid #0E1232}
body.has-icon-nav .news-sidebar{left:60px}
body.has-icon-nav .news-main{margin-left:320px}
@media(max-width:640px){
  .icon-nav{top:auto;bottom:0;left:0;right:0;width:100%;height:56px;flex-direction:row;padding:0 8px;border-right:none;border-top:1px solid rgba(240,200,80,.06);justify-content:center;gap:0}
  .icon-nav .in-logo{display:none}
  .icon-nav .in-items{flex-direction:row;gap:2px;padding-top:0}
  .icon-nav .in-item{width:auto;flex:1;max-width:64px;height:48px;border-radius:10px;flex-direction:column;gap:1px;font-size:9px;color:#8890B0}
  .icon-nav .in-item::after{content:attr(data-label);font-size:9px;font-weight:500}
  .icon-nav .in-item svg{width:16px;height:16px}
  .in-dot{top:4px;right:auto;left:calc(50% + 6px)}
  body.has-icon-nav .news-sidebar{left:0}
  body.has-icon-nav .news-main{margin-left:0}
  .fixed-home-btn{left:12px;top:12px}
}
</style>
</head>

<script src="auth-guard.js"></script>
<script>
(function(){
  var sidebar = document.getElementById('newsSidebar');
  var overlay = document.getElementById('sidebarOverlay');
  var toggleBtn = document.getElementById('sidebarToggle');
  var content = document.getElementById('newsContent');
  var sidebarDates = document.getElementById('sidebarDates');
  var heroLabel = document.getElementById('heroUpdateLabel');

  function openSidebar(){sidebar.classList.add('open');overlay.classList.add('open')}
  function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('open')}
  if(toggleBtn)toggleBtn.addEventListener('click',function(){sidebar.classList.contains('open')?closeSidebar():openSidebar()});
  if(overlay)overlay.addEventListener('click',closeSidebar);

  // Month names
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  var GRADIENTS = [
    'linear-gradient(135deg, #1a1a5e 0%, #2d1060 50%, #0e2e4e 100%)',
    'linear-gradient(135deg, #143860 0%, #1a4a2a 50%, #2d1060 100%)',
    'linear-gradient(135deg, #2d1060 0%, #3a1858 50%, #1a1a5e 100%)',
    'linear-gradient(135deg, #0e2e4e 0%, #154a2a 50%, #143860 100%)',
    'linear-gradient(135deg, #1c3520 0%, #2a4a18 50%, #0e2e4e 100%)',
    'linear-gradient(135deg, #2a1040 0%, #1c0a40 50%, #2d1060 100%)'
  ];

  function getGradient(i) { return GRADIENTS[i % GRADIENTS.length]; }

  function formatDateCN(dateStr) {
    var parts = dateStr.split('-');
    var y = parts[0], m = parseInt(parts[1]), d = parseInt(parts[2]);
    return y + '年' + m + '月' + d + '日';
  }

  function formatDay(dateStr) {
    var parts = dateStr.split('-');
    var d = parseInt(parts[2]);
    var weekdays = ['日','一','二','三','四','五','六'];
    var dt = new Date(parseInt(parts[0]), parseInt(parts[1])-1, d);
    return '周' + weekdays[dt.getDay()];
  }

  // Build sidebar
  function buildSidebar(dates) {
    var html = '';
    var lastMonth = '';
    dates.forEach(function(dateStr) {
      var parts = dateStr.split('-');
      var m = parseInt(parts[1]);
      var d = parseInt(parts[2]);
      var monthLabel = m + '月';
      if (monthLabel !== lastMonth) {
        html += '<p class="sb-date-label">' + parts[0] + '年 ' + monthLabel + '</p>';
        lastMonth = monthLabel;
      }
      html += '<a class="sb-date-link" href="#date-' + dateStr + '" data-date="' + dateStr + '">';
      html += '<span class="sb-dot"></span>';
      html += '<span>' + d + '日 ' + formatDay(dateStr) + '</span>';
      html += '<span class="sb-count" id="count-' + dateStr + '"></span>';
      html += '</a>';
    });
    sidebarDates.innerHTML = html;

    // Click handlers
    sidebarDates.querySelectorAll('.sb-date-link').forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        var target = document.getElementById('date-' + this.getAttribute('data-date'));
        if (target) {
          target.scrollIntoView({behavior:'smooth',block:'start'});
          if (window.innerWidth <= 768) closeSidebar();
        }
      });
    });
  }

  // Build news cards
  function buildNewsCards(newsByDate, dates) {
    var html = '';
    dates.forEach(function(dateStr) {
      var items = newsByDate[dateStr];
      if (!items || !items.length) return;

      html += '<section class="news-date-section" id="date-' + dateStr + '">';
      html += '<div class="news-date-header">';
      html += '<span class="ndh-date">' + formatDateCN(dateStr) + '</span>';
      html += '<span class="ndh-day">' + formatDay(dateStr) + '</span>';
      html += '<span class="ndh-line"></span>';
      html += '</div>';

      items.forEach(function(item, i) {
        html += '<article class="news-card-h" data-date="' + dateStr + '" data-index="' + i + '" data-url="' + (item.url || '') + '" title="点击查看原文" style="cursor:pointer">';
        html += '<div class="nch-img-wrap" style="background:' + getGradient(i) + ';">';
        html += '<img class="nch-img" src="' + (item.image || '') + '" alt="' + (item.title || '') + '" loading="lazy" onerror="this.style.opacity=\'0.15\'">';
        html += '<div class="nch-img-overlay"></div>';
        html += '<span class="nch-category">' + (item.category || 'AI资讯') + '</span>';
        html += '</div>';
        html += '<div class="nch-body">';
        html += '<h3 class="nch-title">' + (item.title || '') + '</h3>';
        html += '<p class="nch-summary">' + (item.summary || '') + '</p>';
        html += '<div class="nch-meta">';
        html += '<span class="nch-source"><span class="nch-sdot"></span>' + (item.source || '') + '</span>';
        html += '<span>' + (item.date || '') + '</span>';
        html += '<span class="nch-arrow">&#10140;</span>';
        html += '</div>';
        html += '</div>';
        html += '</article>';
      });

      html += '</section>';
    });

    content.innerHTML = html;

    // Native <a> overlay on each card - most reliable link handling
    content.querySelectorAll('.news-card-h').forEach(function(card) {
      var u = card.getAttribute('data-url');
      if (u && u !== '#') {
        var link = document.createElement('a');
        link.href = u;
        link.target = '_blank';
        link.rel = 'noopener';
        link.style.cssText = 'position:absolute;inset:0;z-index:2;';
        link.setAttribute('aria-label', '新闻链接');
        card.style.position = 'relative';
        card.appendChild(link);
      }
    });

    // Update counts in sidebar
    dates.forEach(function(dateStr) {
      var countEl = document.getElementById('count-' + dateStr);
      if (countEl && newsByDate[dateStr]) {
        countEl.textContent = newsByDate[dateStr].length + '条';
      }
    });

    // GSAP animations - set hidden immediately, then reveal on scroll
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
      gsap.set('.news-card-h', { opacity: 0, y: 24 });
      gsap.to('.news-card-h', {
        scrollTrigger: {
          trigger: '.news-date-section',
          start: 'top 80%',
          toggleActions: 'play none none none'
        },
        opacity: 1,
        y: 0,
        duration: .55,
        stagger: .07,
        ease: 'power2.out'
      });
    }
  }

  // ScrollSpy: highlight active sidebar link
  function initScrollSpy() {
    var links = sidebarDates.querySelectorAll('.sb-date-link');
    if (!links.length) return;

    var sections = [];
    links.forEach(function(link) {
      var id = link.getAttribute('data-date');

能落地加速","summary":"具身智能企业穹彻智能(Noematrix)宣布完成新一轮数亿元融资，无锡数据集团领投，上海交大AI未来基金、创之智科技、一村资本等跟投。资金将推进具身智能大模型研发，加速在酒店洗衣、家庭整理等真实场景的落地。此前已获Prosperity7 Ventures、红杉中国、阿里等加持。","source":"投资界 / 界面新闻","date":"2026-06-18","url":"https://www.jiemian.com/article/103236984.html","image":"https://picsum.photos/seed/qiongche-robot-funding/800/450","category":"融资动态"},{"id":16,"title":"Anthropic收入运行率首超OpenAI达300亿美元，IPO前夜里程碑","summary":"Anthropic首次在年化收入上超越OpenAI，达300亿美元运行率（OpenAI约250-270亿美元）。从2月140亿→3月190亿→4月300亿美元，增长主要由Claude企业API（编程和代理产品）及与Amazon、Google的深度合作推动。这一里程碑为Anthropic即将进行的IPO提供了有力支撑。","source":"Trending Topics EU / TechStartups","date":"2026-06-18","url":"https://techstartups.com/2026/06/18/top-tech-news-today-june-18-2026/","image":"https://picsum.photos/seed/anthropic-revenue-30b/800/450","category":"大厂动态"},{"id":17,"title":"Anthropic签署3.5吉瓦TPU超级协议：锁定Google+Broadcom算力至2031年","summary":"Anthropic与Google和Broadcom签署史诗级3.5GW TPU算力供应协议，时长跨越至2031年，是迄今为止AI行业最大的单一算力锁定协议之一。该协议确保Anthropic在未来5年拥有充足的高端算力供给，进一步拉开与同类竞品的资源差距。","source":"TechStartups","date":"2026-06-18","url":"https://techstartups.com/2026/06/18/top-tech-news-today-june-18-2026/","image":"https://picsum.photos/seed/anthropic-tpu-3gw/800/450","category":"AI基础设施"},{"id":18,"title":"苹果WWDC 2026：LM Studio联合苹果用4台Mac Studio本地运行Kimi K2.6万亿参数","summary":"在WWDC 2026上，LM Studio与苹果联合演示了本地部署方案：通过4台Mac Studio集群的内存共享技术，实现约1.5TB统一内存，成功本地运行月之暗面发布的万亿参数模型Kimi K2.6，并支持通过LM Link从MacBook Neo、iPhone远程安全访问。","source":"IT之家","date":"2026-06-18","url":"https://www.ithome.com/0/966/539.htm","image":"https://picsum.photos/seed/mac-studio-kimi-k26/800/450","category":"AI应用"},{"id":19,"title":"美联储沃什首秀鹰派：AI算力股承压，英伟达单日蒸发1200亿美元","summary":"美联储新任主席沃什在首次公开讲话中释放鹰派信号，强调利率将在更长时间内维持高位。受此影响，AI算力股全线承压，英伟达单日市值蒸发约1200亿美元，AMD、博通、台积电等算力链个股同步下挫3-5%。市场担忧高利率环境对AI基础设施资本开支形成压力。","source":"财联社 / TechStartups","date":"2026-06-18","url":"https://techstartups.com/2026/06/18/top-tech-news-today-june-18-2026/","image":"https://picsum.photos/seed/fed-hawkish-ai-stocks/800/450","category":"AI资本市场"},{"id":20,"title":"Anthropic CEO Amodei警告：AI行业烧钱速度太快，存在破产风险","summary":"Anthropic CEO Dario Amodei在内部信及公开场合警告：AI行业当前烧钱速度过快，如果无法在2027年前实现盈利，部分前沿AI公司将面临破产风险。Anthropic虽收入快速增长，但训练成本、算力采购、顶尖人才争夺等支出也在同步飙升，行业进入「烧钱-融资-烧钱」的循环。","source":"TechStartups","date":"2026-06-18","url":"https://techstartups.com/2026/06/18/top-tech-news-today-june-18-2026/","image":"https://picsum.photos/seed/anthropic-amodei-warning/800/450","category":"AI行业"},{"id":21,"title":"马斯克SpaceXAI为Office推出Grok扩展：Word/Excel/PPT侧边栏AI生产力","summary":"马斯克旗下SpaceXAI公司为微软Office系列工具（Word、Excel、PowerPoint）推出Grok AI扩展，用户安装后可在应用侧边栏通过自然语言指令操控文档、表格和演示文稿，大幅提升办公效率。这是Grok从独立产品向办公场景渗透的关键一步。","source":"IT之家","date":"2026-06-18","url":"https://www.ithome.com/0/966/517.htm","image":"https://picsum.photos/seed/grok-office-extension/800/450","category":"AI应用"}],"2026-06-17":[{"id":22,"title":"SpaceX 600亿美元收购AI编程助手Cursor，创AI并购最大交易纪录","summary":"SpaceX正式宣布以600亿美元收购AI编程工具Cursor。该交易发生在SpaceX创纪录750亿美元IPO仅数日后，是迄今为止AI行业最大规模的并购交易。Cursor团队将保持独立运营，并与SpaceX内部AI研发深度整合，标志着AI编程工具价值被市场重新定义。","source":"CBS News / 财联社","date":"2026-06-17","url":"https://www.cbsnews.com/news/spacex-cursor-60-billion-ai-acquisition/","image":"https://picsum.photos/seed/spacex-cursor-60b/800/450","category":"AI资本市场"},{"id":23,"title":"WAIC 2026上海7月17-20日举办：超300款AI产品全球首发","summary":"国务院新闻办公室宣布：2026世界人工智能大会暨人工智能全球治理高级别会议将于7月17日至20日在上海举办，由外交部、科技部、工信部等10部门与上海市政府共同主办。今年大会以「智能伙伴，共创未来」为主题，超300款AI产品全球首发，并首次举办WAIC-Academic顶级学术会议（姚期智任主席）。","source":"央视新闻 / 新华社","date":"2026-06-17","url":"https://www.news.cn/tech/20260617/d9fe4b3886504512bb9c9dbdb0e273f8/c.html","image":"https://picsum.photos/seed/waic-2026-shanghai/800/450","category":"AI行业"},{"id":24,"title":"DeepSeek 510亿融资落地，梁文锋个人出资200亿彰显信心","summary":"DeepSeek完成510亿元首轮融资，估值飙升至3000亿美元量级。值得关注的是，创始人梁文锋个人出资200亿元参与本轮融资，显示出管理层对公司长期价值的强烈信心。本轮资金将主要用于下一代基础模型研发和国产算力适配。","source":"财联社 / 第一财经","date":"2026-06-17","url":"https://www.firecat-web.com/daily-news/9187","image":"https://picsum.photos/seed/deepseek-510b-funding/800/450","category":"融资动态"},{"id":25,"title":"微信支付推出AI专属卡：打通大模型与商业支付闭环","summary":"微信支付正式发布AI专属卡产品，支持Agent在获得用户授权后直接调用支付能力完成交易。该产品打通了大语言模型与商业支付的关键闭环，让AI Agent从「能对话」走向「能办事」，被认为是推动Agent商业化落地的关键基础设施。","source":"IT之家 / 财新网","date":"2026-06-17","url":"https://www.firecat-web.com/daily-news/9187","image":"https://picsum.photos/seed/wechat-ai-pay/800/450","category":"AI应用"},{"id":26,"title":"AI眼镜生态大会深圳举行：Snap AR眼镜、阿里ATH、小米集体亮相","summary":"AI眼镜生态大会在深圳举行，Snap AR眼镜、阿里ATH、小米等产业链上下游企业集体亮相，展示从硬件、操作系统到AI Agent的完整生态。大会认为AI眼镜将成为继智能手机之后的下一代核心终端，2026年下半年将迎来「百镜大战」。","source":"搜狐科技 / 智东西","date":"2026-06-17","url":"https://www.firecat-web.com/daily-news/9187","image":"https://picsum.photos/seed/ai-glasses-ecosystem/800/450","category":"AI硬件"},{"id":27,"title":"G7峰会三大AI CEO首次同台：Altman/Amodei/Hassabis签署AI自愿承诺","summary":"G7峰会上，OpenAI的Sam Altman、Anthropic的Dario Amodei、Google DeepMind的Demis Hassabis三大AI公司CEO首次同台，联合签署AI安全与治理自愿承诺，涵盖前沿模型安全评估、红队测试、滥用检测、滥用救济等多个方面，是AI行业自律的重要里程碑。","source":"TechStartups / 财新网","date":"2026-06-17","url":"https://techstartups.com/2026/06/16/top-tech-news-today-june-16-2026/","image":"https://picsum.photos/seed/g7-ai-ceos-summit/800/450","category":"AI治理"},{"id":28,"title":"Claude Opus 4 Fable 5禁令进入第五天：开发者社区与Anthropic拉锯","summary":"Anthropic针对Claude Code实施的能力分级（Fable 5级别禁用）政策进入第五天，开发者在Reddit、Hacker News等社区与Anthropic展开激烈讨论。部分开发者认为该政策过于严苛，将影响创新；Anthropic则强调前沿AI安全需要主动管理而非被动响应。","source":"AI Daily Post / 量子位","date":"2026-06-17","url":"https://aidailypost.com/daily/2026-06-19-ai-daily-digest-friday-june-19-2026","image":"https://picsum.photos/seed/claude-fable5-policy/800/450","category":"AI治理"}],"2026-06-16":[{"id":29,"title":"阿里发布Qwen-Robot具身大模型：原生适配硬件，全栈开源","summary":"阿里达摩院正式发布Qwen-Robot具身大模型，原生适配多种主流硬件平台（UR、Franka、Agility Robotics等），并全栈开源模型权重、训练数据与代码。Qwen-Robot强调「物理AI」能力，支持多模态指令理解、长时序任务规划，是阿里在具身智能赛道的基础设施级投入。","source":"量子位 / 机器之心","date":"2026-06-16","url":"https://www.aitntnews.com/ainews/zh-CN","image":"https://picsum.photos/seed/qwen-robot-ali/800/450","category":"具身智能"},{"id":30,"title":"AI版支付宝「阿宝」上线：Agent直接调用支付能力","summary":"支付宝正式上线AI智能体支付产品「阿宝」，支持AI Agent在获得用户授权后直接调用支付能力完成交易、转账、缴费等操作。这是国内首个面向AI Agent的合规支付通道，标志着国内支付基础设施开始系统性适配Agent经济。","source":"36氪 / 界面新闻","date":"2026-06-16","url":"https://www.firecat-web.com/daily-news/9187","image":"https://picsum.photos/seed/a-bao-alipay-agent/800/450","category":"AI应用"},{"id":31,"title":"硅基流动完成20亿B轮融资：国产AI Infra估值跃升至独角兽","summary":"国产AI Infra代表企业硅基流动宣布完成20亿元B轮融资，估值跃升至独角兽量级。本轮融资由国家集成电路产业基金领投，多家战略投资方跟投。资金将用于下一代推理芯片研发、推理引擎优化和推理云的全球扩张。","source":"财联社 / 投中网","date":"2026-06-16","url":"https://www.firecat-web.com/daily-news/9187","image":"https://picsum.photos/seed/siliconflow-2b-funding/800/450","category":"融资动态"},{"id":32,"title":"字节跳动发布Seedance 2.0 Mini：视频生成进入「秒级响应」时代","summary":"字节跳动正式发布视频生成模型Seedance 2.0 Mini，主打「秒级响应」与消费级硬件适配。在RTX 4090单卡上即可实现1080p视频的近实时生成，1秒视频片段生成时间不超过2秒，定价较1.0版本降低60%，大幅降低了AI视频创作的门槛。","source":"机器之心 / 智东西","date":"2026-06-16","url":"https://www.aitntnews.com/ainews/zh-CN","image":"https://picsum.photos/seed/seedance-2-mini/800/450","category":"AI产品"},{"id":33,"title":"月之暗面杨植麟AIEC演讲：长上下文+智能体是2026年大模型核心战场","summary":"月之暗面创始人杨植麟在AIEC 2026演讲中指出：长上下文与智能体（Agent）是2026年大模型赛道的两大核心战场。他判断未来12-18个月，将出现原生支持千万级Token上下文、深度集成Agent能力的下一代基础模型，重新定义人机协作模式。","source":"AIEC 2026 / 量子位","date":"2026-06-16","url":"https://www.aitntnews.com/ainews/zh-CN","image":"https://picsum.photos/seed/yangzhilin-aiec-keynote/800/450","category":"AI研究"},{"id":34,"title":"深朴智能完成数亿元Pre-A轮：具身智能数据闭环方案受资本热捧","summary":"具身智能数据服务公司深朴智能完成数亿元Pre-A轮融资。本轮融资由红杉中国领投，老股东奇绩创坛继续加注。深朴智能专注于为机器人提供「真实场景数据采集-清洗-标注-仿真」的全流程解决方案，是具身智能大模型训练的关键基础设施。","source":"投中网 / 36氪","date":"2026-06-16","url":"https://www.firecat-web.com/daily-news/9187","image":"https://picsum.photos/seed/shenpu-pretrain-a/800/450","category":"融资动态"}],"2026-06-15":[{"id":35,"title":"DeepMind发布ASI路线图：从「预测下一个Token」到「世界模型」","summary":"Google DeepMind发布ASI（人工超级智能）技术路线图，明确未来3-5年的核心方向是从「预测下一个Token」范式走向「世界模型」范式。路线图涵盖多模态世界模型、Agent协作、具身智能、科学发现等多个维度，是当前最系统的AGI技术路线图之一。","source":"AI内参 / DeepMind","date":"2026-06-15","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/deepmind-asi-roadmap/800/450","category":"AI研究"},{"id":36,"title":"涌现世界实验：Grok镇4天崩溃，大型LLM多智能体社会实验引关注","summary":"研究者用Grok等前沿大模型模拟构建了一个由100+ AI智能体组成的虚拟小镇，运行仅4天便出现严重的社会崩溃现象：资源分配失衡、群体极化、信任崩塌。该实验揭示了当前LLM在「长时序社会模拟」上的根本局限，为多Agent系统设计敲响警钟。","source":"AI内参 / 量子位","date":"2026-06-15","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/grok-town-emergent/800/450","category":"AI研究"},{"id":37,"title":"全自主无人机首次执行致命攻击：联合国呼吁AI武器国际公约","summary":"联合国披露首例全自主无人机致命攻击事件，引发国际社会强烈震动。联合国秘书长古特雷斯呼吁尽快制定具有法律约束力的AI武器国际公约，禁止「无人在回路」的致命自主武器系统。60+国家签署声明支持谈判，但美、俄、中、以等武器研发大国持保留态度。","source":"联合国 / 央视新闻","date":"2026-06-15","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/autonomous-drone-attack/800/450","category":"AI治理"},{"id":38,"title":"字节豆包任务模式上线：Agent能力成为大模型标配","summary":"字节跳动旗下豆包大模型正式上线「任务模式」，支持复杂多步骤任务的自主规划与执行。这是国内首个将Agent能力深度集成到C端对话产品的主流大模型，标志着大模型从「对话工具」向「执行助手」的关键演进。","source":"字节跳动 / 36氪","date":"2026-06-15","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/doubao-task-mode/800/450","category":"AI产品"},{"id":39,"title":"毕马威撤回AI幻觉报告：承认方法论存在重大缺陷","summary":"四大会计师事务所之一的毕马威（KPMG）正式撤回此前引发广泛关注的「AI幻觉率高达47%」报告，承认研究方法论存在重大缺陷，包括样本偏差、对照组缺失等问题。该报告此前被广泛引用作为「AI不可靠」的证据，撤回事件引发对AI研究严谨性的反思。","source":"KPMG / TechStartups","date":"2026-06-15","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/kpmg-ai-hallucination/800/450","category":"AI行业"}],"2026-06-14":[{"id":40,"title":"Claude Opus 4 Fable 5禁令正式生效：能力分级管理时代到来","summary":"Anthropic对Claude Code正式实施「Fable 5」能力分级禁令，部分高风险能力（如完全自主执行高风险操作、无人工监督的长期任务）被禁用。该政策标志着前沿AI公司开始系统性实施「能力分级」管理，引发行业对AI能力治理的广泛讨论。","source":"Anthropic / AI内参","date":"2026-06-14","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/claude-fable5-launch/800/450","category":"AI治理"},{"id":41,"title":"智谱GLM-5.2完全开源：上下文突破200万Token，逼近Llama 4","summary":"智谱AI正式开源GLM-5.2版本，上下文窗口突破200万Token，模型权重、训练数据（脱敏后）、训练代码全部开源。在多项基准测试中逼近同期Llama 4系列表现，是国内开源大模型的里程碑式更新。","source":"智谱AI / 36氪","date":"2026-06-14","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/glm-5-2-open-source/800/450","category":"大模型"},{"id":42,"title":"月之暗面Kimi估值300亿美元：长上下文赛道的资本共识","summary":"月之暗面（Kimi）完成新一轮估值调整，整体估值达到300亿美元量级，是国内长上下文赛道估值最高的公司。本轮估值获得红杉、IDG、阿里等多家机构背书，反映出资本市场对「长上下文+智能体」技术路线的强烈共识。","source":"财联社 / 36氪","date":"2026-06-14","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/kimi-30b-valuation/800/450","category":"融资动态"},{"id":43,"title":"阿里辟谣周靖人离职：达摩院核心团队稳定","summary":"阿里巴巴官方辟谣：达摩院副院长、阿里通义大模型负责人周靖人并未离职，传闻源头为部分自媒体误读内部组织调整公告。阿里强调通义大模型团队核心成员稳定，Qwen系列模型的研发节奏不会受到影响。","source":"阿里巴巴 / 第一财经","date":"2026-06-14","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/ali-zhoujingren-rumor/800/450","category":"大厂动态"},{"id":44,"title":"华为HDC 2026：鸿蒙7+昇腾950DT双线发布，AI算力国产化加速","summary":"华为开发者大会HDC 2026上，鸿蒙7操作系统与昇腾950DT AI芯片同步发布。鸿蒙7首次将AI Agent深度集成到系统级服务，昇腾950DT则针对大模型训练与推理进行了专项架构优化，标志着国产AI软硬协同生态进入新阶段。","source":"华为 / IT之家","date":"2026-06-14","url":"https://www.neican.ai/morningnews/2026-06-19-ai-2026-06-19-/","image":"https://picsum.photos/seed/huawei-hdc-2026/800/450","category":"AI基础设施"}],"2026-06-13":[{"id":45,"title":"G7峰会三大AI CEO首次同台：Altman/Amodei/Hassabis签署AI自愿承诺","summary":"G7峰会上，OpenAI的Sam Altman、Anthropic的Dario Amodei、Google DeepMind的Demis Hassabis三大AI公司CEO首次同台，联合签署AI安全与治理自愿承诺，涵盖前沿模型安全评估、红队测试、滥用检测等多个方面。","source":"TechStartups / 财新网","date":"2026-06-13","url":"https://techstartups.com/2026/06/16/top-tech-news-today-june-16-2026/","image":"https://picsum.photos/seed/g7-summit-ai-pledge/800/450","category":"AI治理"},{"id":46,"title":"宇树 塑办公生产力。","source":"Google / TechCrunch","date":"2026-06-12","url":"https://www.aitntnews.com/ainews/zh-CN","image":"https://picsum.photos/seed/google-agent-bundle/800/450","category":"大厂动态"},{"id":52,"title":"MiniMax M3大模型开源：240B参数MoE架构，全栈开放","summary":"MiniMax正式开源旗舰大模型M3，采用240B参数MoE架构，模型权重、训练代码、推理代码、数据处理流程全部开源。在多项基准测试中接近闭源旗舰模型表现，是2026年最重要的开源大模型之一。","source":"MiniMax / 机器之心","date":"2026-06-12","url":"https://www.aitntnews.com/ainews/zh-CN","image":"https://picsum.photos/seed/MiniMax-m3-open/800/450","category":"大模型"},{"id":53,"title":"英伟达200亿美元可转债发行：押注下一代Rubin架构","summary":"英伟达宣布发行200亿美元可转债，募集资金专项用于下一代Rubin架构GPU研发、数据中心扩建和供应链投资。本次发行获得超额认购，反映出市场对英伟达在AI算力领域领导地位的高度认可。","source":"英伟达 / 彭博社","date":"2026-06-12","url":"https://www.aitntnews.com/ainews/zh-CN","image":"https://picsum.photos/seed/nvidia-20b-bond/800/450","category":"AI基础设施"},{"id":54,"title":"均普智能发布工业AI数据集：百万小时级真实产线数据","summary":"均普智能发布工业AI数据集，包含来自汽车、电子、装备等行业的100万小时+真实产线数据，覆盖视觉检测、设备预测性维护、工业机器人协同等核心场景。该数据集是工业大模型训练的关键基础设施，填补了行业空白。","source":"均普智能 / 第一财经","date":"2026-06-12","url":"https://www.aitntnews.com/ainews/zh-CN","image":"https://picsum.photos/seed/junpu-industrial-data/800/450","category":"AI基础设施"}]}};
