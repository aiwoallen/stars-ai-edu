<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部课程 - 群星</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['"Noto Sans SC"', '"Space Grotesk"', 'system-ui', 'sans-serif'],
        display: ['"Space Grotesk"', '"Noto Sans SC"', 'sans-serif'],
      },
      colors: {
        deep: { DEFAULT: '#0A0E27', card: '#141832', hover: '#1A2248' },
        gold: { DEFAULT: '#F0C850', light: '#F8E090', dim: '#A08030' },
        star: { white: '#E8ECF1', muted: '#8890B0', dim: '#555D80' },
      }
    }
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC','Space Grotesk',system-ui,sans-serif;background:#0A0E27;color:#E8ECF1;overflow-x:hidden}

  .cosmic-bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .nebula{position:absolute;border-radius:50%;filter:blur(120px);opacity:.16}
  .nebula-1{width:900px;height:900px;background:radial-gradient(circle,rgba(91,155,213,.5) 0%,transparent 70%);top:-10%;left:-15%}
  .nebula-2{width:700px;height:700px;background:radial-gradient(circle,rgba(240,200,80,.14) 0%,transparent 70%);top:55%;right:-10%}
  .nebula-3{width:600px;height:600px;background:radial-gradient(circle,rgba(108,92,231,.2) 0%,transparent 70%);bottom:5%;left:25%}
  .star-field{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star-dot{position:absolute;border-radius:50%;background:#fff}
  .grain-overlay{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E")}

  .nav-logo .sub{font-weight:400;font-size:10px;color:#8890B0;letter-spacing:2px;margin-top:2px}
  
  /* Cinematic Center Hero */
  .hero-section{position:relative;z-index:2;padding-top:200px;padding-bottom:60px;text-align:center}
  .hero-radial{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(91,155,213,.08) 0%,rgba(240,200,80,.04) 30%,transparent 70%)}
  .hero-label{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:rgba(240,200,80,.5);margin-bottom:24px;position:relative}
  .hero-title{font-size:clamp(2.8rem,6vw,4.8rem);font-weight:500;color:#E8ECF1;letter-spacing:1px;line-height:1.12;max-width:700px;margin:0 auto 24px;position:relative}
  .hero-subtitle{font-size:16px;color:#8890B0;font-weight:300;max-width:520px;margin:0 auto;position:relative;line-height:1.8}

  /* Guidance hint */
  .hero-guidance{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:10px 22px;border-radius:24px;background:rgba(240,200,80,.06);border:1px solid rgba(240,200,80,.15);font-size:13px;color:#F0C850;font-weight:400;letter-spacing:.5px;transition:all .4s}
  .hero-guidance:hover{background:rgba(240,200,80,.12);border-color:rgba(240,200,80,.3)}
  .hero-guidance .guidance-arrow{display:inline-block;animation:guidancePulse 2s ease-in-out infinite}

  @keyframes guidancePulse{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(4px);opacity:1}}

  /* Hub Cards */
  .hub-section{padding:80px 0 120px;position:relative;z-index:2}
  .hub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px;max-width:900px;margin:0 auto}

  .hub-card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 40px;border-radius:28px;text-decoration:none;overflow:hidden;transition:all .6s cubic-bezier(.16,1,.3,1);min-height:340px;cursor:pointer}

  .hub-card.basic{background:linear-gradient(160deg,#244468 0%,#1a3252 60%,#162642 100%);border:1px solid rgba(91,155,213,.35);box-shadow:0 0 48px rgba(91,155,213,.08)}
  .hub-card.basic:hover{border-color:rgba(91,155,213,.65);transform:translateY(-6px);box-shadow:0 24px 64px rgba(91,155,213,.3);background:linear-gradient(160deg,#2c5080 0%,#1e3c64 60%,#1a3052 100%)}

  .hub-card.advance{background:linear-gradient(160deg,#3a2860 0%,#2a2050 60%,#201c42 100%);border:1px solid rgba(108,92,231,.35);box-shadow:0 0 48px rgba(108,92,231,.08)}
  .hub-card.advance:hover{border-color:rgba(108,92,231,.65);transform:translateY(-6px);box-shadow:0 24px 64px rgba(108,92,231,.3);background:linear-gradient(160deg,#483078 0%,#342868 60%,#282050 100%)}

  /* "推荐起点" badge */
  .hub-badge{position:absolute;top:18px;right:18px;padding:5px 14px;border-radius:14px;font-size:10px;font-weight:500;letter-spacing:1px;z-index:2;pointer-events:none}
  .hub-badge.recommend{background:rgba(240,200,80,.14);color:#F0C850;border:1px solid rgba(240,200,80,.2)}

  .hub-card-content{position:relative;z-index:1}
  .hub-icon{font-size:64px;display:block;margin-bottom:20px;line-height:1;transition:transform .6s cubic-bezier(.16,1,.3,1)}
  .hub-card:hover .hub-icon{transform:scale(1.1)}
  .hub-card.basic .hub-icon{color:#94CCF0}
  .hub-card.advance .hub-icon{color:#C0B0F0}
  .hub-label{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:5px;text-transform:uppercase;margin-bottom:14px}
  .hub-card.basic .hub-label{color:#94CCF0}
  .hub-card.advance .hub-label{color:#C0B0F0}
  .hub-name{font-size:clamp(1.6rem,2.5vw,2rem);font-weight:500;color:#F0F2F5;letter-spacing:1px;margin-bottom:16px}
  .hub-desc{font-size:14px;color:#B0B8C0;line-height:1.8;margin-bottom:28px;max-width:300px}
  .hub-cta{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:48px;font-size:13px;font-weight:500;letter-spacing:.5px;transition:all .4s}
  .hub-card.basic .hub-cta{color:#94CCF0;border:1px solid rgba(91,155,213,.35);background:rgba(91,155,213,.1)}
  .hub-card.basic:hover .hub-cta{background:rgba(91,155,213,.18);border-color:rgba(91,155,213,.55)}
  .hub-card.advance .hub-cta{color:#C0B0F0;border:1px solid rgba(108,92,231,.35);background:rgba(108,92,231,.1)}
  .hub-card.advance:hover .hub-cta{background:rgba(108,92,231,.18);border-color:rgba(108,92,231,.55)}
  .hub-arrow{font-size:16px;transition:transform .4s}
  .hub-card:hover .hub-arrow{transform:translateX(3px)}

  .site-footer{padding:48px 0;border-top:1px solid rgba(240,200,80,.06);z-index:2;position:relative}
  .footer-grid{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px}
  .footer-logo{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#F0C850;letter-spacing:2px}
  .footer-links{display:flex;gap:28px}
  .footer-links a,.footer-copy{font-size:11px;color:#555D80;text-decoration:none;transition:color .3s}
  .footer-links a:hover{color:#F0C850}

  @media(max-width:768px){
    
    
    .hero-section{padding-top:100px;padding-bottom:48px}
    .hero-title{font-size:clamp(2rem,8vw,3rem)}
    .hero-subtitle{font-size:14px;max-width:340px}
    .hero-guidance{font-size:12px;padding:8px 18px}
    .hub-section{padding:48px 0 80px}
    .hub-grid{grid-template-columns:1fr;padding:0 20px;gap:20px}
    .hub-card{padding:40px 24px;min-height:auto}
    .hub-card-content{display:flex;flex-direction:column;align-items:center}
    .hub-icon{font-size:48px;margin-bottom:14px}
    .hub-label{font-size:10px;letter-spacing:4px}
    .hub-name{font-size:clamp(1.3rem,5vw,1.5rem)}
    .hub-desc{font-size:13px;max-width:260px}
    .hub-cta{padding:14px 32px;font-size:13px}
    .hub-badge{top:14px;right:14px;padding:4px 12px;font-size:9px}
    .footer-grid{flex-direction:column;text-align:center}
    .footer-links{gap:20px}
  }

/* ---- Icon Sidebar Nav ---- */
.icon-nav{position:fixed;left:0;top:0;bottom:0;width:60px;z-index:180;display:flex;flex-direction:column;align-items:center;padding:20px 0;background:rgba(14,18,40,.94);border-right:1px solid rgba(240,200,80,.06)}
.icon-nav .in-logo{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:700;color:#F0C850;letter-spacing:2px;writing-mode:vertical-lr;margin-bottom:20px}
.icon-nav .in-items{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px}
.icon-nav .in-item{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#8890B0;text-decoration:none;transition:all .25s;position:relative}
.icon-nav .in-item:hover{color:#E8ECF1;background:rgba(240,200,80,.04)}
.icon-nav .in-item.active{color:#F0C850;background:rgba(240,200,80,.08)}
.icon-nav .in-item svg{width:18px;height:18px}
.icon-nav .in-dot{position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%;background:#F0C850;border:1.5px solid #0E1232}
.icon-nav .in-item.logged-in::before{content:"";position:absolute;top:6px;right:10px;width:5px;height:5px;border-radius:50%;background:#60d080;border:1px solid #0E1232}
body.has-icon-nav{padding-left:60px}
@media(max-width:640px){
  .icon-nav{top:auto;bottom:0;left:0;right:0;width:100%;height:56px;flex-direction:row;padding:0 8px;border-right:none;border-top:1px solid rgba(240,200,80,.06);justify-content:center;gap:0}
  .icon-nav .in-logo{display:none}
  .icon-nav .in-items{flex-direction:row;gap:2px;padding-top:0}
  .icon-nav .in-item{width:auto;flex:1;max-width:64px;height:48px;border-radius:10px;flex-direction:column;gap:1px;font-size:9px;color:#8890B0}
  .icon-nav .in-item::after{content:attr(data-label);font-size:9px;font-weight:500}
  .icon-nav .in-item svg{width:16px;height:16px}
  .in-dot{top:4px;right:auto;left:calc(50% + 6px)}
  body.has-icon-nav{padding-left:0;padding-bottom:56px}
}
</style>
<link rel="stylesheet" href="stars-apple-theme.css">
</head>
<body class="has-icon-nav">
<!-- ===== Icon Sidebar Navigation ===== -->
<nav class="icon-nav" id="iconNav">
  <div class="in-logo">群星</div>
  <div class="in-items">
    <a href="index.html" class="in-item" data-label="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="全部课程.html" class="in-item" data-label="课程">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    </a>
        <a href="community.html" class="in-item" data-label="社区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="9" r="2.5"/><circle cx="7" cy="15" r="2.5"/><path d="M5.5 18.5c.5-1.5 2-3 3.5-3.5M16 12c1.5.5 3 2 3.5 3.5M11 14c-1 1-2 1.5-3.5 1"/></svg>
    </a>
<a href="news.html" class="in-item" data-label="资讯">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span class="in-dot"></span>
    </a>
    <a href="profile.html" class="in-item" data-label="我的">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </div>
</nav>
<main style="overflow-x:hidden;width:100%;max-width:100%">

<div class="cosmic-bg">
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>
</div>
<div class="star-field" id="starField"></div>
<div class="grain-overlay"></div>

<!-- Cinematic Center Hero -->
<section class="hero-section">
  <div class="hero-radial"></div>
  <div class="max-w-6xl mx-auto px-6 md:px-8" style="position:relative">
    <p class="hero-label">Curriculum</p>
    <h1 class="hero-title">探索你的学习路径</h1>
    <p class="hero-subtitle">从基础认知到进阶实战，选择适合你的起点</p>
    <a href="#hub-cards" class="hero-guidance">
      新同学？建议从基础内容开始
      <span class="guidance-arrow">&#8595;</span>
    </a>
  </div>
</section>

<!-- Hub Cards -->
<section class="hub-section" id="hub-cards">
  <div class="hub-grid">

    <a href="basic.html" class="hub-card basic">
      <span class="hub-badge recommend">推荐起点</span>
      <div class="hub-card-content">
        <span class="hub-icon">&#9679;</span>
        <p class="hub-label">Foundation</p>
        <h2 class="hub-name">基础内容</h2>
        <p class="hub-desc">从零开始理解AI。六大核心课程，图文并茂，系统建立AI认知体系。</p>
        <span class="hub-cta">
          探索基础
          <span class="hub-arrow">&#8594;</span>
        </span>
      </div>
    </a>

    <a href="advance.html" class="hub-card advance">
      <div class="hub-card-content">
        <span class="hub-icon">&#9711;</span>
        <p class="hub-label">Advanced</p>
        <h2 class="hub-name">进阶内容</h2>
        <p class="hub-desc">夯实编程基础。Python 入门到实践 —— AI 时代最核心的编程语言。</p>
        <span class="hub-cta">
          探索进阶
          <span class="hub-arrow">&#8594;</span>
        </span>
      </div>
    </a>

  </div>
</section>

<footer class="site-footer">
  <div class="max-w-6xl mx-auto px-8">
    <div class="footer-grid">
      <div>
        <div class="footer-logo">群星</div>
        <p class="footer-copy" style="margin-top:4px">AI EDUCATION</p>
      </div>
      <div class="footer-links">
        <a href="about.html">隐私政策</a>
        <a href="about.html">服务条款</a>
        <a href="contact.html">联系我们</a>
      </div>
      <p class="footer-copy">&copy; 2026 群星</p>
    </div>
  </div>
</footer>

</main>

<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  var c=document.getElementById('starField'),f=document.createDocumentFragment();
  for(var i=0;i<120;i++){var d=document.createElement('div');d.className='star-dot';var s=Math.random()*2+.6,g=Math.random()>.78;d.style.cssText='width:'+s+'px;height:'+s+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;background:'+(g?'#F0C850':'#fff')+';opacity:'+(Math.random()*.4+.2)+';animation:tw'+i+' '+(Math.random()*4+2)+'s ease-in-out infinite;animation-delay:'+(Math.random()*5)+'s';f.appendChild(d)}c.appendChild(f);
  var st=document.createElement('style'),cs='';
  for(var i=0;i<120;i++)cs+='@keyframes tw'+i+'{0%,100%{opacity:'+(Math.random()*.3+.15)+';transform:scale(1)}50%{opacity:'+(Math.random()*.5+.5)+';transform:scale(1.4)}}';
  st.textContent=cs;document.head.appendChild(st);
})();

/* GSAP hub card entrance */
gsap.set('.hub-card', { opacity: 1 });
gsap.from('.hub-card', {
  scrollTrigger: { trigger: '.hub-grid', start: 'top bottom+=60px', once: true },
  opacity: 0, y: 40, duration: .8, stagger: .15, ease: 'power3.out'
});

/* Hero entrance */
gsap.from('.hero-label', { opacity: 0, y: 20, duration: .8, ease: 'power2.out', delay: .3 });
gsap.from('.hero-title', { opacity: 0, y: 30, duration: 1, ease: 'power3.out', delay: .5 });
gsap.from('.hero-subtitle', { opacity: 0, y: 20, duration: .8, ease: 'power2.out', delay: .7 });
gsap.from('.hero-guidance', { opacity: 0, y: 16, duration: .8, ease: 'power2.out', delay: .9 });

/* Guidance arrow smooth scroll */
document.querySelector('.hero-guidance').addEventListener('click',function(e){
  e.preventDefault();
  document.getElementById('hub-cards').scrollIntoView({behavior:'smooth'});
});
</script>

<script>
<script>
(function(){
var links=document.querySelectorAll('.icon-nav .in-item');
var page=window.location.pathname.split('/').pop();
links.forEach(function(a){
  var href=a.getAttribute('href')||'';
  if(href===page||(page===''&&href==='index.html')){a.classList.add('active')}
  if(href==='profile.html'){try{var t=JSON.parse(localStorage.getItem('stars_token'));if(t&&t.token)a.classList.add('logged-in')}catch(e){}}
});
})();
</script>
<script src="stars-apple-enhance.js" defer></script>
</body>
</html>
