<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进阶内容 - 群星</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['"Noto Sans SC"', '"Space Grotesk"', 'system-ui', 'sans-serif'],
        display: ['"Space Grotesk"', '"Noto Sans SC"', 'sans-serif'],
      },
      colors: {
        deep: { DEFAULT: '#0A0E27', card: '#141832', hover: '#1A2248' },
        gold: { DEFAULT: '#F0C850', light: '#F8E090', dim: '#A08030' },
        star: { white: '#E8ECF1', muted: '#8890B0', dim: '#555D80' },
      }
    }
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC','Space Grotesk',system-ui,sans-serif;background:#0A0E27;color:#E8ECF1;overflow-x:hidden}

  .cosmic-bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .nebula{position:absolute;border-radius:50%;filter:blur(120px);opacity:.16}
  .nebula-1{width:900px;height:900px;background:radial-gradient(circle,rgba(91,155,213,.5) 0%,transparent 70%);top:-10%;left:-15%}
  .nebula-2{width:700px;height:700px;background:radial-gradient(circle,rgba(240,200,80,.14) 0%,transparent 70%);top:55%;right:-10%}
  .nebula-3{width:600px;height:600px;background:radial-gradient(circle,rgba(108,92,231,.2) 0%,transparent 70%);bottom:5%;left:25%}
  .star-field{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star-dot{position:absolute;border-radius:50%;background:#fff}
  .grain-overlay{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E")}

  
  
  
  
  .nav-logo .sub{font-weight:400;font-size:10px;color:#8890B0;letter-spacing:2px;margin-top:2px}
  
  

  .section-spacer{padding:100px 0;position:relative;z-index:2}
  .section-label{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:rgba(240,200,80,.45);margin-bottom:16px}
  .section-heading{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:500;color:#E8ECF1;letter-spacing:1px;margin-bottom:12px}
  .section-sub{font-size:15px;color:#8890B0;font-weight:300;max-width:520px}

  .bento-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;grid-auto-flow:dense}
  .bento-card{background:rgba(20,24,50,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(240,200,80,.08);border-radius:20px;overflow:hidden;transition:all .5s cubic-bezier(.16,1,.3,1);cursor:pointer;position:relative;text-decoration:none;display:block}
  .bento-card:hover{border-color:rgba(240,200,80,.25);transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.4);background:rgba(26,34,72,.8)}
  .bento-card.placeholder{cursor:default;opacity:.65}
  .bento-card.placeholder:hover{border-color:rgba(240,200,80,.08);transform:none;box-shadow:none;background:rgba(20,24,50,.5)}
  .card-glow{position:absolute;inset:0;background:radial-gradient(ellipse at var(--mx,50%) var(--my,50%),rgba(240,200,80,.08) 0%,transparent 60%);opacity:0;transition:opacity .5s;pointer-events:none}
  .bento-card:hover .card-glow{opacity:1}
  .bento-card.placeholder:hover .card-glow{opacity:0}
  .card-img{width:100%;height:160px;transition:all .6s cubic-bezier(.16,1,.3,1)}
  .bento-card:not(.placeholder):hover .card-img{transform:scale(1.04);filter:brightness(1.2)}
  .card-body{padding:24px}
  .card-icon{font-size:28px;margin-bottom:12px;display:block}
  .card-title{font-size:18px;font-weight:500;color:#E8ECF1;margin-bottom:8px}
  .card-desc{font-size:13px;color:#8890B0;line-height:1.6;margin-bottom:14px}
  .card-tags{display:flex;gap:8px;flex-wrap:wrap}
  .card-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:400;letter-spacing:.5px;background:rgba(240,200,80,.08);color:#F0C850;border:1px solid rgba(240,200,80,.15)}
  .card-tag.primary{background:rgba(240,200,80,.14);border-color:rgba(240,200,80,.28);color:#F8E090}

  .coming-section{margin-top:48px}
  .coming-header{text-align:center;margin-bottom:28px}
  .coming-placeholder-card{background:rgba(20,24,50,.5);border:1px dashed rgba(240,200,80,.12);border-radius:20px;padding:40px 24px;text-align:center;transition:all .4s}
  .coming-placeholder-card:hover{border-color:rgba(240,200,80,.22);background:rgba(26,34,72,.6)}
  .cp-icon{font-size:36px;margin-bottom:14px;display:block;opacity:.5}
  .cp-title{font-size:18px;font-weight:500;color:#E8ECF1;margin-bottom:8px}
  .cp-desc{font-size:12px;color:#8890B0;line-height:1.6;margin-bottom:16px}
  .cp-badge{display:inline-block;padding:4px 14px;border-radius:16px;font-size:10px;font-weight:500;letter-spacing:1px;background:rgba(240,200,80,.08);color:#F0C850;border:1px solid rgba(240,200,80,.15)}

  /* Hero - Cinematic Center */
  .hero-section{position:relative;z-index:2;padding-top:180px;padding-bottom:80px;text-align:center}
  .hero-radial{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(91,155,213,.08) 0%,rgba(240,200,80,.03) 30%,transparent 70%)}
  .hero-label{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:rgba(240,200,80,.5);margin-bottom:24px;position:relative}
  .hero-title{font-size:clamp(2.6rem,5.5vw,4.2rem);font-weight:500;color:#E8ECF1;letter-spacing:1px;line-height:1.15;max-width:800px;margin:0 auto 20px;position:relative}
  .hero-subtitle{font-size:16px;color:#8890B0;font-weight:300;max-width:560px;margin:0 auto 48px;position:relative;line-height:1.8}

  /* Bottom TabBar - Mobile only */
  
  
  
  
  
  

  .site-footer{padding:48px 0;border-top:1px solid rgba(240,200,80,.06);z-index:2;position:relative}
  .footer-grid{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px}
  .footer-logo{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#F0C850;letter-spacing:2px}
  .footer-links{display:flex;gap:28px}
  .footer-links a,.footer-copy{font-size:11px;color:#555D80;text-decoration:none;transition:color .3s}
  .footer-links a:hover{color:#F0C850}

  @media(max-width:1024px){.bento-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:768px){
    
    
    body{padding-bottom:72px}
    .hero-section{padding-top:100px;padding-bottom:48px}.hero-title{font-size:clamp(2rem,7vw,2.8rem)}.hero-subtitle{font-size:14px;max-width:340px}
    .bento-grid{grid-template-columns:1fr}.section-spacer{padding:48px 0}
    .card-img{height:130px}
    .footer-grid{flex-direction:column;text-align:center}
    .footer-links{gap:20px}
  }
.nav-pill{display:none}.nav-logo{display:none}.nav-link{display:none}
.menu-btn{position:fixed;top:20px;left:20px;z-index:200;width:44px;height:44px;border-radius:50%;background:rgba(10,14,39,.85);border:1px solid rgba(240,200,80,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:0}
.menu-btn:hover{background:rgba(20,25,55,.92);border-color:rgba(240,200,80,.45);transform:scale(1.05)}
.menu-btn img{width:24px;height:24px}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.sidebar-menu{position:fixed;top:0;left:0;bottom:0;width:275px;background:rgba(10,14,39,.97);border-right:1px solid rgba(240,200,80,.1);z-index:160;transform:translateX(-100%);transition:transform .35s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column}
.sidebar-menu.open{transform:translateX(0)}
.sidebar-header{padding:36px 28px 24px;border-bottom:1px solid rgba(240,200,80,.08);display:flex;align-items:center;gap:12px}
.sidebar-header img{width:32px;height:32px}
.sidebar-header span{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#F0C850;letter-spacing:2px}
.sidebar-items{flex:1;padding:16px 0;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:14px;padding:14px 28px;color:#8890B0;text-decoration:none;font-size:14px;transition:all .25s;border-left:3px solid transparent}
.sidebar-item:hover,.sidebar-item.active{color:#F0C850;background:rgba(240,200,80,.05);border-left-color:#F0C850}
.sidebar-item .si-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:20px 28px;border-top:1px solid rgba(240,200,80,.08);font-size:10px;color:#555D80}</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="菜单"><img src="stars_logo.png" alt="群星" onerror="this.style.display='none';this.parentElement.innerHTML='&#9737;'"></button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar-menu" id="sidebarMenu">
<div class="sidebar-header"><img src="stars_logo.png" alt="群星" onerror="this.style.display='none'"><span>群星</span></div>
<div class="sidebar-items">
<a href="index.html" class="sidebar-item"><span class="si-icon">&#9737;</span>首页</a>
<a href="全部课程.html" class="sidebar-item active"><span class="si-icon">&#9783;</span>课程</a>
<a href="about.html" class="sidebar-item"><span class="si-icon">&#9776;</span>关于</a>
<a href="profile.html" class="sidebar-item"><span class="si-icon">&#9731;</span>我的</a>
</div>
<div class="sidebar-footer">&copy; 2026 群星 AI教育</div>
</nav>
<main style="overflow-x:hidden;width:100%;max-width:100%">

<div class="cosmic-bg">
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>
</div>
<div class="star-field" id="starField"></div>
<div class="grain-overlay"></div>



<!-- Cinematic Center Hero -->
<section class="hero-section">
  <div class="hero-radial"></div>
  <div class="max-w-6xl mx-auto px-8" style="position:relative">
    <p class="hero-label">Advanced Track</p>
    <h1 class="hero-title">进阶内容</h1>
    <p class="hero-subtitle">夯实编程基础 — 掌握AI时代最核心的编程语言</p>
  </div>
</section>

<!-- Python 基础 占位 -->
<section class="section-spacer" style="padding-top:0">
  <div class="max-w-6xl mx-auto px-8">
    <div class="bento-grid">
      <div class="bento-card placeholder">
        <div class="card-glow"></div>
        <div class="card-img" style="background:linear-gradient(135deg,#1a3050 0%,#0e2040 50%,#1a1040 100%)"></div>
        <div class="card-body">
          <span class="card-icon">&#9000;</span>
          <h3 class="card-title">Python 基础</h3>
          <p class="card-desc">从变量、循环到函数，掌握AI时代最核心的编程语言</p>
          <div class="card-tags">
            <span class="card-tag primary">进阶内容</span>
            <span class="card-tag">即将上线</span>
            <span class="card-tag">N 课时</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="max-w-6xl mx-auto px-8">
    <div class="footer-grid">
      <div>
        <div class="footer-logo">群星</div>
        <p class="footer-copy" style="margin-top:4px">AI EDUCATION</p>
      </div>
      <div class="footer-links">
        <a href="about.html">隐私政策</a>
        <a href="about.html">服务条款</a>
        <a href="contact.html">联系我们</a>
      </div>
      <p class="footer-copy">&copy; 2026 群星</p>
    </div>
  </div>
</footer>

<!-- Mobile Bottom TabBar -->


</main>

<script>
gsap.registerPlugin(ScrollTrigger);

(function(){
  var c=document.getElementById('starField'),f=document.createDocumentFragment();
  for(var i=0;i<120;i++){var d=document.createElement('div');d.className='star-dot';var s=Math.random()*2+.6,g=Math.random()>.78;d.style.cssText='width:'+s+'px;height:'+s+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;background:'+(g?'#F0C850':'#fff')+';opacity:'+(Math.random()*.4+.2)+';animation:tw'+i+' '+(Math.random()*4+2)+'s ease-in-out infinite;animation-delay:'+(Math.random()*5)+'s';f.appendChild(d)}c.appendChild(f);
  var st=document.createElement('style'),cs='';
  for(var i=0;i<120;i++)cs+='@keyframes tw'+i+'{0%,100%{opacity:'+(Math.random()*.3+.15)+';transform:scale(1)}50%{opacity:'+(Math.random()*.5+.5)+';transform:scale(1.4)}}';
  st.textContent=cs;document.head.appendChild(st);
})();



document.querySelectorAll('.bento-card:not(.placeholder)').forEach(function(c){
  c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();c.style.setProperty('--mx',((e.clientX-r.left)/r.width)*100+'%');c.style.setProperty('--my',((e.clientY-r.top)/r.height)*100+'%')});
});

/* GSAP card entrance */
document.querySelectorAll('.bento-card').forEach(function(card, i) {
  gsap.set(card, { opacity: 1 });
  gsap.from(card, {
    scrollTrigger: { trigger: card, start: 'top bottom-=80px', once: true },
    opacity: 0, y: 30, duration: .7, delay: i * .08, ease: 'power2.out'
  });
});
</script>

<script>// Sidebar toggle
(function(){var btn=document.getElementById('menuBtn'),menu=document.getElementById('sidebarMenu'),overlay=document.getElementById('sidebarOverlay');function open(){menu.classList.add('open');overlay.classList.add('open')}function close(){menu.classList.remove('open');overlay.classList.remove('open')}if(btn)btn.addEventListener('click',function(){menu.classList.contains('open')?close():open()});if(overlay)overlay.addEventListener('click',close)})();</script>
</body>
</html>
