<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Noto Sans SC"','"Space Grotesk"','system-ui','sans-serif'],display:['"Space Grotesk"','"Noto Sans SC"','sans-serif']},colors:{deep:{DEFAULT:'#0A0E27',card:'#141832',hover:'#1A2248'},gold:{DEFAULT:'#F0C850',light:'#F8E090',dim:'#A08030'},star:{white:'#E8ECF1',muted:'#8890B0',dim:'#555D80'}}}}}</script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC','Space Grotesk',system-ui,sans-serif;background:#0A0E27;color:#E8ECF1;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}

  .cosmic-bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .nebula{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15}
  .nebula-1{width:800px;height:800px;background:radial-gradient(circle,rgba(91,155,213,.5) 0%,transparent 70%);top:-10%;left:-15%}
  .nebula-2{width:700px;height:700px;background:radial-gradient(circle,rgba(240,200,80,.14) 0%,transparent 70%);top:55%;right:-10%}
  .nebula-3{width:600px;height:600px;background:radial-gradient(circle,rgba(108,92,231,.2) 0%,transparent 70%);bottom:5%;left:25%}
  .star-field{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star-dot{position:absolute;border-radius:50%;background:#fff}
  .grain-overlay{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E")}

  
  
  
  
  .nav-logo .sub{font-weight:400;font-size:10px;color:#8890B0;letter-spacing:2px;margin-top:2px}
  
  

  .section-spacer{padding:100px 0;position:relative;z-index:2}
  .section-label{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:rgba(240,200,80,.45);margin-bottom:16px}
  .section-heading{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:500;color:#E8ECF1;letter-spacing:1px;margin-bottom:12px}
  .section-sub{font-size:15px;color:#8890B0;font-weight:300;max-width:520px;margin:0 auto}

  .contact-card{background:rgba(20,24,50,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(240,200,80,.1);border-radius:24px;padding:56px 48px;text-align:center;max-width:600px;margin:0 auto;transition:all .5s}
  .contact-card:hover{border-color:rgba(240,200,80,.22);box-shadow:0 16px 48px rgba(0,0,0,.4)}
  .contact-icon{font-size:48px;margin-bottom:20px;display:block;opacity:.7}
  .contact-card h3{font-size:20px;font-weight:500;color:#E8ECF1;margin-bottom:8px}
  .contact-card .email{font-size:18px;font-family:'Space Grotesk',monospace;color:#F0C850;letter-spacing:1px;word-break:break-all}
  .contact-card .hint{font-size:13px;color:#8890B0;margin-top:16px;line-height:1.7}
  .contact-card .divider{width:40px;height:1px;background:rgba(240,200,80,.2);margin:32px auto}

  .social-links{display:flex;justify-content:center;gap:16px;margin-top:24px;flex-wrap:wrap}
  .social-link{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:30px;font-size:13px;color:#8890B0;text-decoration:none;border:1px solid rgba(240,200,80,.12);transition:all .35s;background:rgba(20,24,50,.5)}
  .social-link:hover{color:#F0C850;border-color:rgba(240,200,80,.3);background:rgba(240,200,80,.06)}

  /* Bottom TabBar - Mobile only */
  
  
  
  
  
  

  .site-footer{padding:48px 0;border-top:1px solid rgba(240,200,80,.06);z-index:2;position:relative;margin-top:auto}
  .footer-grid{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px}
  .footer-logo{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#F0C850;letter-spacing:2px}
  .footer-links{display:flex;gap:28px}
  .footer-links a,.footer-copy{font-size:11px;color:#555D80;text-decoration:none;transition:color .3s}
  .footer-links a:hover{color:#F0C850}

  @media(max-width:768px){
    
    
    body{padding-bottom:72px}
    .contact-card{padding:36px 24px}.section-spacer{padding:72px 0}
    .footer-grid{flex-direction:column;text-align:center}
    .footer-links{gap:20px}
  }

.nav-logo{display:none}
.nav-link{display:none}
.menu-btn{position:fixed;top:20px;left:20px;z-index:200;width:44px;height:44px;border-radius:50%;background:rgba(10,14,39,.85);border:1px solid rgba(240,200,80,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:0}
.menu-btn:hover{background:rgba(20,25,55,.92);border-color:rgba(240,200,80,.45);transform:scale(1.05)}
.menu-btn img{width:24px;height:24px}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.sidebar-menu{position:fixed;top:0;left:0;bottom:0;width:275px;background:rgba(10,14,39,.97);border-right:1px solid rgba(240,200,80,.1);z-index:160;transform:translateX(-100%);transition:transform .35s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column}
.sidebar-menu.open{transform:translateX(0)}
.sidebar-header{padding:36px 28px 24px;border-bottom:1px solid rgba(240,200,80,.08);display:flex;align-items:center;gap:12px}
.sidebar-header img{width:32px;height:32px}
.sidebar-header span{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#F0C850;letter-spacing:2px}
.sidebar-items{flex:1;padding:16px 0;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:14px;padding:14px 28px;color:#8890B0;text-decoration:none;font-size:14px;transition:all .25s;border-left:3px solid transparent}
.sidebar-item:hover,.sidebar-item.active{color:#F0C850;background:rgba(240,200,80,.05);border-left-color:#F0C850}
.sidebar-item .si-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:20px 28px;border-top:1px solid rgba(240,200,80,.08);font-size:10px;color:#555D80}

</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="菜单"><img src="stars_logo.png" alt="群星" onerror="this.style.display='none';this.parentElement.innerHTML='&#9737;'"></button>

<a href="about.html" class="sidebar-item"><span class="si-icon">&#9776;</span>关于</a>
<a href="profile.html" class="sidebar-item"><span class="si-icon">&#9731;</span>我的</a>
</div>
<div class="sidebar-footer">&copy; 2026 群星 AI教育</div>
</nav>

<div class="cosmic-bg">
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>
</div>
<div class="star-field" id="starField"></div>
<div class="grain-overlay"></div>

<section class="section-spacer" style="padding-top:160px;flex:1">
  <div class="max-w-4xl mx-auto px-8">
    <div class="mb-14 text-center">
      <p class="section-label">Contact</p>
      <h1 class="section-heading">联系我们</h1>
      <p class="section-sub">有任何问题或建议，欢迎随时与我们取得联系</p>
    </div>

    <div class="contact-card">
      <span class="contact-icon">&#9993;</span>
      <h3>电子邮箱</h3>
      <p class="email">star_group2011@163.com</p>
      <div class="divider"></div>
      <p class="hint">我们通常会在 1-2 个工作日内回复您的邮件。<br>请在邮件中详细描述您的问题，以便我们更快地为您提供帮助。</p>

      <div class="social-links">
        <a href="index.html" class="social-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          探索课程
        </a>
        <a href="about.html" class="social-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          隐私政策
        </a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="max-w-6xl mx-auto px-8">
    <div class="footer-grid">
      <div>
        <div class="footer-logo">群星</div>
        <p class="footer-copy" style="margin-top:4px">AI EDUCATION</p>
      </div>
      <div class="footer-links">
        <a href="about.html">隐私政策</a>
        <a href="about.html">服务条款</a>
        <a href="contact.html">联系我们</a>
      </div>
      <p class="footer-copy">&copy; 2026 群星</p>

<!-- Mobile Bottom TabBar -->

<script>
(function(){
  var c=document.getElementById('starField'),f=document.createDocumentFragment();
  for(var i=0;i<120;i++){var d=document.createElement('div');d.className='star-dot';var s=Math.random()*2+.6,g=Math.random()>.78;d.style.cssText='width:'+s+'px;height:'+s+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;background:'+(g?'#F0C850':'#fff')+';opacity:'+(Math.random()*.4+.2)+';animation:tw'+i+' '+(Math.random()*4+2)+'s ease-in-out infinite;animation-delay:'+(Math.random()*5)+'s';f.appendChild(d)}c.appendChild(f);
  var st=document.createElement('style'),cs='';
  for(var i=0;i<120;i++)cs+='@keyframes tw'+i+'{0%,100%{opacity:'+(Math.random()*.3+.15)+';transform:scale(1)}50%{opacity:'+(Math.random()*.5+.5)+';transform:scale(1.4)}}';
  st.textContent=cs;document.head.appendChild(st);
})();

</script>
<script>
// Sidebar menu toggle
(function(){
var btn=document.getElementById('menuBtn'),menu=document.getElementById('sidebarMenu'),overlay=document.getElementById('sidebarOverlay');
function open(){menu.classList.add('open');overlay.classList.add('open');btn.classList.add('pressed')}
function close(){menu.classList.remove('open');overlay.classList.remove('open');btn.classList.remove('pressed')}
if(btn)btn.addEventListener('click',function(){menu.classList.contains('open')?close():open()});
if(overlay)overlay.addEventListener('click',close);
})();
</script>
</body>
</html>
